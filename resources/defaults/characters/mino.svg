<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity="0.18"/></filter>
    <linearGradient id="scarf" x1="0" x2="1"><stop offset="0" stop-color="#56B9F2"/><stop offset="1" stop-color="#2E8FD2"/></linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <!-- ears -->
    <g id="ears">
      <ellipse cx="372" cy="226" rx="72" ry="188" fill="#E8D3BB" transform="rotate(-15 372 226)"/>
      <ellipse cx="652" cy="226" rx="72" ry="188" fill="#E8D3BB" transform="rotate(15 652 226)"/>
      <ellipse cx="372" cy="228" rx="35" ry="143" fill="#E9B7AF" transform="rotate(-15 372 228)"/>
      <ellipse cx="652" cy="228" rx="35" ry="143" fill="#E9B7AF" transform="rotate(15 652 228)"/>
      <ellipse cx="341" cy="94" rx="47" ry="61" fill="#B79A82" transform="rotate(-15 341 94)"/>
      <ellipse cx="683" cy="94" rx="47" ry="61" fill="#B79A82" transform="rotate(15 683 94)"/>
    </g>
    <!-- body -->
    <ellipse cx="512" cy="720" rx="214" ry="228" fill="#E9D7C0"/>
    <ellipse cx="512" cy="745" rx="145" ry="171" fill="#F2E5D4"/>
    <!-- feet -->
    <ellipse cx="386" cy="917" rx="113" ry="61" fill="#E9D7C0" transform="rotate(-8 386 917)"/>
    <ellipse cx="638" cy="917" rx="113" ry="61" fill="#E9D7C0" transform="rotate(8 638 917)"/>
    <!-- head -->
    <ellipse cx="512" cy="463" rx="246" ry="226" fill="#EBDAC5"/>
    <ellipse cx="512" cy="525" rx="171" ry="119" fill="#F4E8D8"/>
