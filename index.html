<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Cartoon Studio — Create your own 2D animated cartoon show</title>

    <!-- Search engines, app stores, AI summaries -->
    <meta
      name="description"
      content="An open-source desktop studio for making 2D animated cartoon shows. Write a script, pick voices, place characters, render to MP4."
    />
    <meta
      name="keywords"
      content="cartoon show, 2D animation, animation studio, lip sync, text to speech, MP4 render, open source, desktop app, dialogue, scriptable animation"
    />

    <!-- Open Graph / link previews. Image points at the GitHub-hosted
         hero so previews work when the repo URL is shared anywhere
         (Slack, Twitter, etc.) once the repo is pushed. -->
    <meta property="og:title" content="Cartoon Studio" />
    <meta
      property="og:description"
      content="Create your own 2D animated cartoon show. Open-source desktop studio — script in, MP4 out."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/Jellypod-Inc/cartoon-studio/main/docs/hero.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cartoon Studio" />
    <meta
      name="twitter:description"
      content="Create your own 2D animated cartoon show. Open-source desktop studio — script in, MP4 out."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/Jellypod-Inc/cartoon-studio/main/docs/hero.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <!-- Newsreader: editorial serif for titles, scene slates, dialogue text.
         Optical sizing for large headings. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap"
    />
    <!-- Switzer: humanist grotesk for UI and body; Departure Mono: pixel
         monospace for captions, line numbers, status readouts. Both
         Fontshare, free tier. -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&f[]=departure-mono@400&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/renderer/renderer.ts"></script>
  </body>
</html>
